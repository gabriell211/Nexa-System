[package]
name = "nexa-collector-core"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1"
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1"
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snmp2 = "0.5.2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
if-addrs = "0.15.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
