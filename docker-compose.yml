services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexa
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa"]
      interval: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build: ./portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api

volumes:
  postgres-data:
