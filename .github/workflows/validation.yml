name: Nexa validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nexa-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirement-trace:
    name: README requirement traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all documented requirements and acceptance cases
        run: python3 scripts/verify_requirements.py

  laravel:
    name: Laravel API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, bcmath
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: PHP syntax scan
        run: find app bootstrap database routes -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Run feature tests
        run: php artisan test

  postgres-integration:
    name: Laravel PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexa_test
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: ci-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, bcmath, pcntl
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Execute feature tests against PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexa_test
          DB_USERNAME: nexa
          DB_PASSWORD: ci-only-postgres
          DB_SSLMODE: disable
        run: php artisan test
      - name: Verify concurrent reservations and stock issues in separate processes
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexa_test
          DB_USERNAME: nexa
          DB_PASSWORD: ci-only-postgres
          DB_SSLMODE: disable
        run: php ../scripts/postgres_stock_concurrency.php

  http-session-smoke:
    name: Real HTTP session and CSRF smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: file
      NEXA_BOOTSTRAP_EMAIL: smoke-owner@example.test
      NEXA_BOOTSTRAP_PASSWORD: test-only-long-password-2026
      NEXA_BOOTSTRAP_TENANT: nexa-demo
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, bcmath
          coverage: none
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare independent integration database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/smoke.sqlite
          echo "DB_DATABASE=$(pwd)/database/smoke.sqlite" >> "$GITHUB_ENV"
      - name: Migrate and bootstrap
        run: |
          php artisan migrate --force
          php artisan nexa:bootstrap
      - name: Start real HTTP server
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 > /tmp/nexa-http-smoke.log 2>&1 &
          echo $! > /tmp/nexa-http-smoke.pid
      - name: Verify CSRF and cookie sessions end to end
        run: python3 ../scripts/browser_session_smoke.py
      - name: Display server log on error
        if: failure()
        run: cat /tmp/nexa-http-smoke.log || true

  browser-e2e:
    name: Playwright Chromium E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [core, replenishment]
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: file
      NEXA_BOOTSTRAP_EMAIL: smoke-owner@example.test
      NEXA_BOOTSTRAP_PASSWORD: test-only-long-password-2026
      NEXA_BOOTSTRAP_TENANT: nexa-demo
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Laravel dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated test database
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/browser-e2e.sqlite
          echo "DB_DATABASE=$(pwd)/database/browser-e2e.sqlite" >> "$GITHUB_ENV"
      - name: Migrate and seed the real owner
        working-directory: backend
        run: |
          php artisan migrate --force
          php artisan nexa:bootstrap
      - name: Install React and Playwright dependencies
        working-directory: portal
        run: npm ci --no-audit --no-fund
      - name: Install real Chromium browser
        working-directory: portal
        run: npx playwright install --with-deps chromium
      - name: Start backend and frontend servers
        run: |
          (cd backend && php artisan serve --host=127.0.0.1 --port=8080 > /tmp/nexa-e2e-api.log 2>&1 &)
          (cd portal && npm run dev > /tmp/nexa-e2e-vite.log 2>&1 &)
      - name: Run core desktop and mobile browser E2E
        if: matrix.suite == 'core'
        working-directory: portal
        run: npm run test:e2e -- e2e/operations.spec.ts e2e/reorder-needs.spec.ts e2e/stock-counts.spec.ts
      - name: Run replenishment and supplier browser E2E
        if: matrix.suite == 'replenishment'
        working-directory: portal
        run: npm run test:e2e -- e2e/replenishment-plans.spec.ts e2e/supplier-management.spec.ts e2e/documented-receipts.spec.ts e2e/bulk-stock-receipts.spec.ts --project=desktop-chromium
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-${{ matrix.suite }}
          path: |
            portal/playwright-report/
            portal/test-results/
            /tmp/nexa-e2e-api.log
            /tmp/nexa-e2e-vite.log
          retention-days: 7

  portal:
    name: React portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and bundle
        run: npm run build

  customer-portal:
    name: Customer portal TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-cliente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-cliente/package-lock.json
      - name: Install isolated customer portal dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build customer-only pages
        run: npm run build

  customer-portal-image:
    name: Customer portal container and nginx checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone customer portal container
        run: docker build -t nexa-portal-cliente:test ./portal-cliente
      - name: Verify nginx customer frontend
        run: docker run --rm --add-host api:127.0.0.1 nexa-portal-cliente:test nginx -t

  collector-console-ui:
    name: Collector console TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install console dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build the actual desktop UI
        run: npm run build

  portal-image:
    name: Portal container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production portal image
        run: docker build -t nexa-portal:test ./portal
      - name: Validate nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 nexa-portal:test nginx -t

  backend-image:
    name: API container build and secret exclusion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plant a build-context canary
        run: echo 'APP_KEY=must-not-be-in-image' > backend/.env
      - name: Validate local Compose topology
        run: POSTGRES_PASSWORD=compose-validation-only docker compose config --quiet
      - name: Build API image from pinned dependencies
        run: docker build -t nexa-api:test ./backend
      - name: Verify CLI and absence of local secrets
        run: |
          docker run --rm nexa-api:test php artisan --version
          docker run --rm nexa-api:test sh -ec 'test ! -e /app/.env && test ! -d /app/tests'

  collector-linux-package:
    name: Linux Collector service packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify unit hardening, credential wiring and bash syntax
        run: python3 scripts/verify_collector_linux_service.py
      - name: Verify systemd unit structure
        run: |
          mkdir -p /tmp/nexa-systemd-verify
          sed 's#^ExecStart=.*#ExecStart=/bin/true#' collector/linux/nexa-collector.service > /tmp/nexa-systemd-verify/nexa-collector.service
          systemd-analyze verify /tmp/nexa-systemd-verify/nexa-collector.service

  collector-macos-launchd:
    name: macOS Collector native launchd build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate launchd packaging and shell scripts
        run: |
          python3 scripts/verify_collector_macos_service.py
          plutil -lint collector/macos/com.nexa.collector.plist
      - name: Run native macOS Collector core and daemon unit tests
        working-directory: collector
        run: cargo test --locked -p nexa-collector-core -p nexa-collector-daemon

  collector-linux-installers:
    name: Nexa Collector Linux DEB and RPM installers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/console/package-lock.json
      - name: Install Linux GUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev rpm
      - name: Check native Unix packaging
        run: python3 scripts/verify_collector_unix_installers.py
      - name: Build Linux Collector daemon
        working-directory: collector
        run: cargo build --locked --release -p nexa-collector-daemon
      - name: Stage Linux sidecar
        run: |
          mkdir -p collector/console/src-tauri/binaries
          cp collector/target/release/nexa-collector-daemon collector/console/src-tauri/binaries/nexa-collector-daemon-x86_64-unknown-linux-gnu
          chmod 755 collector/console/src-tauri/binaries/nexa-collector-daemon-x86_64-unknown-linux-gnu
      - name: Install desktop dependencies
        working-directory: collector/console
        run: npm ci
      - name: Build Linux DEB and RPM with GUI and service
        working-directory: collector/console
        run: npm run tauri build -- --bundles deb,rpm
      - name: Keep Linux packages for debugging failed validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-collector-linux-x64-installers-diagnostic
          path: |
            collector/target/release/bundle/deb/*.deb
            collector/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 2
      - name: Inspect native package service and scripts
        run: |
          set -euo pipefail
          deb="$(find collector/target/release/bundle/deb -name '*.deb' -type f -print -quit)"
          rpmfile="$(find collector/target/release/bundle/rpm -name '*.rpm' -type f -print -quit)"
          test -n "$deb" && test -n "$rpmfile"
          echo '--- DEB MANIFEST ---'
          dpkg-deb --contents "$deb"
          echo '--- RPM MANIFEST ---'
          rpm -qpl "$rpmfile"
          echo '--- DEB CONTROL ---'
          dpkg-deb --ctrl-tarfile "$deb" | tar -tf -
          echo '--- RPM LIFECYCLE SCRIPTS ---'
          rpm -qp --scripts "$rpmfile"
          dpkg-deb --contents "$deb" | grep 'usr/lib/nexa-collector/nexa-collector-daemon'
          dpkg-deb --contents "$deb" | grep 'nexa-collector.service'
          dpkg-deb --ctrl-tarfile "$deb" | tar -tf - | grep 'postinst'
          rpm -qpl "$rpmfile" | grep '/usr/lib/nexa-collector/nexa-collector-daemon'
          rpm -qpl "$rpmfile" | grep 'nexa-collector.service'
          rpm -qp --scripts "$rpmfile" | grep 'systemctl daemon-reload'
      - name: Smoke install and remove DEB on disposable Ubuntu runner
        run: |
          set -euo pipefail
          deb="$(find collector/target/release/bundle/deb -name '*.deb' -type f -print -quit)"
          pkgname="$(dpkg-deb -f "$deb" Package)"
          sudo dpkg -i "$deb"
          echo '--- Linux installed files ---'
          sudo find /etc/nexa-collector /var/lib/nexa-collector -maxdepth 2 -printf '%m %u:%g %p\n' || true
          sudo stat -c '%a %U:%G %n' /etc/nexa-collector/config.json /etc/nexa-collector/credentials || true
          systemctl is-enabled nexa-collector.service || true
          getent passwd nexa-collector
          # The runner is intentionally outside the service group: inspect via sudo.
          sudo test -f /etc/nexa-collector/config.json
          test "$(sudo stat -c '%a' /etc/nexa-collector/config.json)" = 640
          test "$(sudo stat -c '%a' /etc/nexa-collector/credentials)" = 700
          if test -r /etc/nexa-collector/config.json; then
            echo 'Collector configuration must not be readable by unprivileged users' >&2
            exit 1
          fi
          test -x /usr/lib/nexa-collector/nexa-collector-daemon
          systemctl is-enabled nexa-collector.service && exit 1 || true
          if systemctl is-active --quiet nexa-collector.service; then
            echo 'Collector must not auto-start without credentials' >&2
            exit 1
          fi
          sudo dpkg --remove "$pkgname"
          sudo test -f /etc/nexa-collector/config.json
          sudo test -d /var/lib/nexa-collector
      - name: Upload Linux DEB and RPM installers
        uses: actions/upload-artifact@v4
        with:
          name: nexa-collector-linux-x64-deb-rpm-unsigned
          path: |
            collector/target/release/bundle/deb/*.deb
            collector/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  collector-macos-installers:
    name: Nexa Collector macOS PKG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/console/package-lock.json
      - name: Validate package hooks and architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          python3 scripts/verify_collector_unix_installers.py
          plutil -lint collector/macos/com.nexa.collector.plist
      - name: Compile native macOS Collector daemon
        working-directory: collector
        run: cargo build --locked --release -p nexa-collector-daemon
      - name: Stage native macOS Tauri sidecar
        run: |
          triple="$(rustc -vV | awk '/^host: / {print $2}')"
          mkdir -p collector/console/src-tauri/binaries
          cp collector/target/release/nexa-collector-daemon "collector/console/src-tauri/binaries/nexa-collector-daemon-$triple"
          chmod 755 "collector/console/src-tauri/binaries/nexa-collector-daemon-$triple"
      - name: Install frontend
        working-directory: collector/console
        run: npm ci
      - name: Bundle macOS graphical application
        working-directory: collector/console
        run: npm run tauri build -- --bundles app
      - name: Build full native Apple Installer PKG
        run: bash collector/macos/build-pkg.sh
      - name: Inspect macOS package
        run: |
          set -euo pipefail
          pkg="$(find collector/target/release/bundle/pkg -type f -name '*.pkg' -print -quit)"
          test -s "$pkg"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          pkgutil --expand "$pkg" "$tmp/expanded"
          echo '--- Expanded macOS PKG ---'
          find "$tmp/expanded" -maxdepth 2 -print
          test -e "$tmp/expanded/Scripts"
          test -f "$tmp/expanded/PackageInfo"
      - name: Smoke install PKG without activating launchd (disposable runner)
        run: |
          set -euo pipefail
          pkg="$(find collector/target/release/bundle/pkg -type f -name '*.pkg' -print -quit)"
          sudo installer -pkg "$pkg" -target /
          echo '--- macOS installed files ---'
          sudo ls -ld "/Applications/Nexa Collector.app" "/Library/PrivilegedHelperTools/NexaCollector/nexa-collector-daemon" "/Library/Application Support/NexaCollector/config.json" "/Library/Application Support/NexaCollector/package/activate.sh"
          sudo find "/Library/Application Support/NexaCollector" -maxdepth 3 -print || true
          dscl . -read /Users/_nexacollector || true
          sudo test -d "/Applications/Nexa Collector.app"
          sudo test -x "/Library/PrivilegedHelperTools/NexaCollector/nexa-collector-daemon"
          sudo test -f "/Library/Application Support/NexaCollector/config.json"
          sudo test -f "/Library/Application Support/NexaCollector/package/activate.sh"
          test "$(sudo stat -f '%Sp %Su:%Sg' '/Library/Application Support/NexaCollector/config.json')" = '-rw-r----- root:_nexacollector'
          if test -r "/Library/Application Support/NexaCollector/config.json"; then
            echo 'Collector configuration must not be readable by unprivileged users' >&2
            exit 1
          fi
          dscl . -read /Users/_nexacollector
          if launchctl print system/com.nexa.collector >/dev/null 2>&1; then
            echo 'LaunchDaemon must not start before credentials are provisioned' >&2
            exit 1
          fi
      - name: Upload unsigned macOS full installer
        uses: actions/upload-artifact@v4
        with:
          name: nexa-collector-macos-${{ matrix.arch }}-pkg-unsigned
          path: collector/target/release/bundle/pkg/*.pkg
          if-no-files-found: error
          retention-days: 7

  collector-windows-service:
    name: Windows Collector native SCM build and tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and execute Windows Collector core/daemon tests
        run: cargo test --locked -p nexa-collector-core -p nexa-collector-daemon
      - name: Repeat multi-process watchdog journal regression on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Watchdog concurrent writer stress run $attempt / 3"
            cargo test --locked -p nexa-collector-core --lib recovery_guard::tests::concurrent_process_writers_preserve_all_events_and_reset -- --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "Concurrent watchdog writers failed on repeat $attempt" }
          }
      - name: Validate native NSIS installer security and service safety
        shell: pwsh
        working-directory: .
        run: python scripts/verify_collector_windows_service.py

  collector-windows-installer:
    name: Nexa Collector Windows Setup.exe build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/console/package-lock.json
      - name: Validate installer contract before packaging
        run: python scripts/verify_collector_windows_service.py
      - name: Compile Windows Collector service executable
        working-directory: collector
        run: cargo build --locked --release -p nexa-collector-daemon
      - name: Stage native Rust sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path collector/console/src-tauri/binaries | Out-Null
          Copy-Item -LiteralPath collector/target/release/nexa-collector-daemon.exe -Destination collector/console/src-tauri/binaries/nexa-collector-daemon-x86_64-pc-windows-msvc.exe
          if (-not (Test-Path collector/console/src-tauri/binaries/nexa-collector-daemon-x86_64-pc-windows-msvc.exe)) { throw 'Collector sidecar not staged' }
      - name: Install desktop dependencies
        working-directory: collector/console
        run: npm ci
      - name: Bundle unsigned NSIS Setup.exe with Tauri 2
        working-directory: collector/console
        run: npm run tauri build -- --bundles nsis
      - name: Confirm elevated UAC manifest in the built Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executables = @(Get-ChildItem -Path 'collector/target/release' -Filter 'nexa-collector-console.exe' -File)
          if ($executables.Count -ne 1) { throw "Nexa Collector console executable missing" }
          $toolRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $tools = @(Get-ChildItem -Path $toolRoot -Filter 'mt.exe' -Recurse -File |
            Where-Object { $_.FullName -like '*\x64\mt.exe' } | Sort-Object FullName)
          if ($tools.Count -eq 0) { throw 'Windows SDK mt.exe was not found' }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'collector-embedded.manifest'
          & $tools[-1].FullName '-nologo' "-inputresource:$($executables[0].FullName);#1" "-out:$manifestPath"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect embedded manifest' }
          [xml]$manifest = Get-Content -Raw -LiteralPath $manifestPath
          $requested = $manifest.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if ($null -eq $requested -or $requested.GetAttribute('level') -ne 'requireAdministrator') {
            throw 'Collector EXE lacks administrator-only UAC manifest'
          }
          if ($requested.GetAttribute('uiAccess') -ne 'false') { throw 'Unexpected Windows UIAccess' }
      - name: Smoke install and uninstall NSIS using real Windows SCM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:TEMP 'NexaCollector-installer-error.txt'
          Remove-Item -LiteralPath $diagnostic -ErrorAction SilentlyContinue
          function Show-InstallerDiagnostics {
            if (Test-Path -LiteralPath $diagnostic) {
              Write-Host "NSIS failure stage: $((Get-Content -Raw -LiteralPath $diagnostic).Trim())"
            } else {
              Write-Host 'No Nexa NSIS hook failure stage was recorded.'
            }
            $programData = Join-Path $env:ProgramData 'NexaCollector'
            Write-Host "ProgramData directory exists: $(Test-Path -LiteralPath $programData)"
            Write-Host "Daemon installed: $(Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'Nexa Collector\nexa-collector-daemon.exe'))"
          }
          $exe = @(Get-ChildItem 'collector/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($exe.Count -ne 1) { throw "Expected one NSIS installer, got $($exe.Count)" }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The disposable Windows runner must be elevated for the SCM installation test.'
          }
            # An unattended fixture exercises the same protected provisioning
            # path as the interactive wizard without exposing values in argv.
            $env:NEXA_INSTALL_COLLECTOR_ID = [guid]::NewGuid().ToString()
            $env:NEXA_INSTALL_TOKEN = [Convert]::ToHexString(
              [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)).ToLowerInvariant()
            # Offline e-mail provisioning exercises the real NSIS/SCM path.
            # Web mode verifies a live backend binding before storing the key;
            # its accepted/rejected paths are covered by Rust and API tests.
            $env:NEXA_INSTALL_API_URL = ''
            $env:NEXA_INSTALL_COMMUNICATION_MODE = 'email'
            $env:NEXA_INSTALL_MAIL_ADDRESS = 'collector@example.test'
            $env:NEXA_INSTALL_MAIL_PASSWORD = 'ci-only-mail-password'
            $env:NEXA_INSTALL_MAIL_RECIPIENT = 'ingest@example.test'
            $env:NEXA_INSTALL_POP3_HOST = 'pop3.example.test'
            $env:NEXA_INSTALL_POP3_PORT = '995'
            $env:NEXA_INSTALL_POP3_SSL = '1'
            $env:NEXA_INSTALL_SMTP_HOST = 'smtp.example.test'
            $env:NEXA_INSTALL_SMTP_PORT = '465'
            $env:NEXA_INSTALL_SMTP_SSL = '1'
          # Start-Process -Wait may wait for child GUI processes too. Monitor
          # the installer process itself and bound execution to two minutes.
          $result = Start-Process -FilePath $exe[0].FullName -ArgumentList '/S' -PassThru
          if (-not $result.WaitForExit(120000)) {
            Show-InstallerDiagnostics
            & "$env:WINDIR\System32\sc.exe" qc NexaCollector
            Stop-Process -Id $result.Id -Force -ErrorAction SilentlyContinue
            throw 'NSIS installer timed out: possible modal SCM error dialog; inspect user screenshot'
          }
          if ($result.ExitCode -ne 0) {
            Show-InstallerDiagnostics
            throw "Installer failed with exit code $($result.ExitCode)"
          }
          $installed = Get-CimInstance Win32_Service -Filter "Name = 'NexaCollector'"
          if ($null -eq $installed) { throw 'NexaCollector service was not registered by NSIS' }
          if ($installed.StartName -notmatch 'LocalService|LOCAL SERVICE') {
            throw "Service is running under unexpected account $($installed.StartName)"
          }
            if ($installed.StartMode -ne 'Auto') { throw 'Provisioned service must start automatically' }
            if ($installed.State -ne 'Running') { throw 'Provisioned service did not start' }
          $directory = Join-Path $env:ProgramData 'NexaCollector'
            $configFile = Join-Path $directory 'config.json'
            if (-not (Test-Path $configFile)) { throw 'Provisioned config missing' }
          if (-not (Test-Path (Join-Path $directory 'credentials'))) { throw 'Protected credentials directory missing' }
            $config = Get-Content -Raw -LiteralPath $configFile | ConvertFrom-Json
            if ($config.collector_id -ne $env:NEXA_INSTALL_COLLECTOR_ID) { throw 'Collector ID not provisioned' }
            if ($config.api_url -ne $env:NEXA_INSTALL_API_URL) { throw 'API URL not provisioned' }
            if ($config.communication_mode -ne 'email') { throw 'E-mail mode not provisioned' }
            if ($null -ne $config.proxy_url) { throw 'E-mail mode unexpectedly configured a proxy' }
            $secrets = Join-Path $directory 'credentials'
            if ((Get-Content -Raw -LiteralPath (Join-Path $secrets 'NEXA_COLLECTOR_TOKEN')) -ne $env:NEXA_INSTALL_TOKEN) {
              throw 'Collector key not provisioned'
            }
            if ($config.mail.address -ne $env:NEXA_INSTALL_MAIL_ADDRESS) { throw 'Mail sender not provisioned' }
            if ((Get-Content -Raw -LiteralPath (Join-Path $secrets 'NEXA_MAIL_PASSWORD')) -ne $env:NEXA_INSTALL_MAIL_PASSWORD) {
              throw 'Mail password not provisioned'
            }
            $dbKey = Get-Content -Raw -LiteralPath (Join-Path $secrets 'NEXA_COLLECTOR_DB_KEY_HEX')
            if ($dbKey -notmatch '^[0-9a-f]{64}$') { throw 'Encrypted queue key not generated' }
            if (Test-Path (Join-Path $secrets 'install-request.utf16')) { throw 'Temporary installer request was retained' }
          & "$env:WINDIR\System32\icacls.exe" (Join-Path $directory 'credentials')
          if ($LASTEXITCODE -ne 0) { throw 'Credentials directory ACL inspection failed' }
          & "$env:WINDIR\System32\sc.exe" qc NexaCollector
          if ($LASTEXITCODE -ne 0) { throw 'SCM query failed' }
          $uninstaller = Join-Path $env:ProgramFiles 'Nexa Collector\uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw "Missing Tauri NSIS uninstaller: $uninstaller" }
          $removed = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru
          if (-not $removed.WaitForExit(120000)) {
            Stop-Process -Id $removed.Id -Force -ErrorAction SilentlyContinue
            throw 'NSIS uninstaller exceeded 120 seconds'
          }
          if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
          # A service may linger in the SCM while it finishes stopping or
          # existing handles are released. Poll rather than assuming 3s.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $left = Get-CimInstance Win32_Service -Filter "Name = 'NexaCollector'"
            if ($null -eq $left) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($null -ne $left) {
            & "$env:WINDIR\System32\sc.exe" query NexaCollector
            throw 'Uninstall left NexaCollector service registered after 60 seconds'
          }
          if (-not (Test-Path $directory)) { throw 'Uninstall destroyed customer data' }
      - name: Upload Windows installer for review
        uses: actions/upload-artifact@v4
        with:
          name: nexa-collector-windows-setup-unsigned
          path: collector/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  collector:
    name: Rust collector core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test collector core and daemon
        run: cargo test --locked -p nexa-collector-core -p nexa-collector-daemon
