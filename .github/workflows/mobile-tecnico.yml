name: Nexa Técnico Mobile Validation

on:
  push:
    paths:
      - 'app-mobile-tecnico/**'
      - '.github/workflows/mobile-tecnico.yml'
      - 'backend/routes/api.php'
      - 'backend/app/Http/Controllers/Api/V1/MobileTechnicianAuthController.php'
  pull_request:
    paths:
      - 'app-mobile-tecnico/**'
      - '.github/workflows/mobile-tecnico.yml'
      - 'backend/routes/api.php'
      - 'backend/app/Http/Controllers/Api/V1/MobileTechnicianAuthController.php'

permissions:
  contents: read

jobs:
  mobile-typecheck:
    name: Expo TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile-tecnico
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Verificar ícones e splash da marca
        run: npm run brand:check
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify native routes and protected pages
        run: npm run routes:check
      - name: Compile Expo Router Android bundle
        run: npm run bundle:android
      - name: Verify public Vercel Laravel API and mobile auth contract
        run: npm run backend:smoke
