name: Nexa Técnico Android APK (internal QA)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mobile-tecnico-apk.yml'
permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app-mobile-tecnico
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platforms"
          java -version
          echo "Android SDK is available on GitHub Ubuntu runner"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check router and type safety
        run: |
          npm run typecheck
          npm run routes:check
          npm run brand:check
      - name: Generate Expo Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release-mode QA APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify output
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-tecnico-internal-qa-apk
          path: app-mobile-tecnico/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
